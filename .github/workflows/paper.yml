name: Paper trading

# Elk uur één ronde: koersen ophalen, elke afdeling laten handelen (nepgeld), dashboard
# bijwerken. De stand van de bot staat op de branch `paper-data`, het dashboard op
# GitHub Pages. Er is in deze workflow geen enkele sleutel of echt geld.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  ronde:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Stand van de vorige ronde ophalen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" paper-data >/dev/null; then
            git clone --depth 1 --branch paper-data "$url" state
          else
            mkdir state && git -C state init -b paper-data && git -C state remote add origin "$url"
          fi
          mkdir -p data logs
          [ -d state/data ] && cp -r state/data/. data/ || true
          [ -d state/logs ] && cp -r state/logs/. logs/ || true
          [ -f state/KILL ] && cp state/KILL KILL || true
          [ -f state/jarvis.json ] && cp state/jarvis.json jarvis.json || true

      - name: Jarvis luistert (commando's van Phil, bijv. /noodstop)
        run: jplh jarvis || true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Paper-ronde
        run: jplh run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Stand bewaren
        run: |
          rm -rf state/data state/logs
          cp -r data logs state/
          if [ -f KILL ]; then cp KILL state/KILL; else rm -f state/KILL; fi
          [ -f jarvis.json ] && cp jarvis.json state/jarvis.json || true
          cd state
          git config user.name "jplh-bot"
          git config user.email "jplh-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Paper-ronde $(date -u +%Y-%m-%dT%H:%MZ)" || echo "niets veranderd"
          # Jarvis kan tussendoor iets bewaard hebben: dan eerst bijwerken en opnieuw proberen.
          for i in 1 2 3; do git push origin paper-data && break; git pull --rebase origin paper-data; done

      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Wachter - melden als de ronde mislukt
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from jplh.notify import Telegram
          from jplh.store import Store
          token = os.environ.get("TELEGRAM_TOKEN")
          db = Path("data/holding.sqlite3")
          chat = Store(db).get_state("telegram", {}).get("chat") if db.exists() else None
          if token and chat:
              Telegram(token).send(chat, "🚨 Jarvis: de paper-ronde van "
                                   f"{datetime.now(tz=UTC):%H:%M} UTC is mislukt. Details: {os.environ['RUN_URL']}")
          PY
