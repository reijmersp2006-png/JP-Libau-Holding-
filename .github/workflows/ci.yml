name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: jplh selftest

  databronnen:
    # Controleert vanaf GitHub of alle databronnen echt bereikbaar zijn en haalt één
    # ronde koersen op. Mag falen zonder de PR te blokkeren: bronnen liggen soms even plat.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: jplh doctor
      - run: jplh collect --limit 48
      - run: jplh status
