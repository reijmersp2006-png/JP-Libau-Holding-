<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>JP-Libau Holding · Command Center</title>
<style>
/* ── Institutional 2.0: design tokens ───────────────────────────────────────── */
:root {
  color-scheme: dark;
  --page: #0a0c10; --surface-1: #0e1116; --surface-2: #141821; --surface-3: #1b2030;
  --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
  --ink-1: #eef0f3; --ink-2: #b9bec8; --ink-3: #8a909c;
  --accent: #c9a961;                     /* merkgoud: alleen voor identiteit en focus */
  --grid: #222734; --axis: #383d4a;
  /* afdelingen = categorische slots 1-5 (gevalideerd, donker, oppervlak #0e1116) */
  --d-crypto: #3987e5; --d-meme: #d95926; --d-stocks: #199e70; --d-metals: #c98500; --d-fx: #d55181;
  /* status: altijd met icoon + label */
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --unknown: #8a909c;
  --up: #0ca30c; --down: #e66767;
  --r: 10px; --gap: 14px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink-1); font: 14px/1.45 var(--sans); }
a { color: var(--ink-1); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .sub { color: var(--ink-2); }
.up { color: var(--up); } .down { color: var(--down); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── shell ── */
header.top { position: sticky; top: 0; z-index: 20; background: rgba(10,12,16,.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; max-width: 1440px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand b { font-size: 15px; letter-spacing: .02em; }
.brand b i { font-style: normal; color: var(--accent); }
.brand span { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .12em; }
nav.main { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; }
nav.main a { padding: 7px 12px; border-radius: 8px; text-decoration: none; color: var(--ink-2); white-space: nowrap; font-size: 13px; }
nav.main a[aria-current="page"] { background: var(--surface-3); color: var(--ink-1); box-shadow: inset 0 -2px 0 var(--accent); }
nav.main a:hover { color: var(--ink-1); }
.fresh { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.links { display: flex; gap: 10px; font-size: 12px; } .links a { color: var(--ink-3); }
main { max-width: 1440px; margin: 0 auto; padding: 18px 20px 60px; }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 13px; margin: 0 0 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
h3 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
.lead { color: var(--ink-2); margin: 0 0 16px; max-width: 80ch; }

/* ── layout primitives ── */
.grid { display: grid; gap: var(--gap); }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-main { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.card { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; overflow-x: auto; }
.card.flat { background: transparent; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
@media (max-width: 1000px) { .g-main, .g3 { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 700px) {
  .g2 { grid-template-columns: minmax(0,1fr); }
  .bar { flex-wrap: wrap; padding: 8px 12px; gap: 8px; } nav.main { order: 3; flex-basis: 100%; }
  .links { display: none; } main { padding: 12px 12px 48px; }
}

/* ── components ── */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface-1); padding: 12px 14px; }
.kpi .l { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.kpi .v { font: 600 22px/1.2 var(--mono); margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.kpi.hero .v { font-size: 30px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
  padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; text-transform: uppercase; }
.status::before { content: attr(data-i); font-size: 10px; }
.s-good { color: var(--good); } .s-warn { color: var(--warn); } .s-serious { color: var(--serious); }
.s-crit { color: #f27b7b; border-color: var(--crit); }   /* tekst lichter voor 4.5:1, rand houdt de statuskleur */ .s-unknown { color: var(--unknown); }
.label { font: 600 10px/1 var(--mono); letter-spacing: .08em; padding: 3px 6px; border-radius: 4px; background: var(--surface-3);
  color: var(--ink-2); text-transform: uppercase; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; }
.scroll { overflow-x: auto; }
button, .btn { font: inherit; font-size: 13px; color: var(--ink-1); background: var(--surface-3); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
button:hover { background: #232a3c; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 18px; color: var(--ink-2); }
.empty b { color: var(--ink-1); }
.att { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; padding: 11px 12px; border-radius: 8px; background: var(--surface-2); align-items: center; }
.att + .att { margin-top: 6px; }
.att .bar-l { align-self: stretch; border-radius: 2px; }
.att .t { font-weight: 600; } .att .d { color: var(--ink-2); font-size: 13px; }
.att a.go { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.meter { height: 6px; background: var(--surface-3); border-radius: 3px; position: relative; overflow: hidden; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.meter.lim::after { content: ""; position: absolute; right: 0; top: -2px; bottom: -2px; width: 2px; background: var(--crit); }
details > summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.layer { border-left: 3px solid var(--line-2); padding: 8px 12px; margin: 10px 0; background: var(--surface-2); border-radius: 0 8px 8px 0; }
.layer.rec { border-color: var(--d-crypto); } .layer.rcn { border-color: var(--d-metals); } .layer.post { border-color: var(--d-fx); }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--surface-3); color: var(--ink-2); }
.tip { position: fixed; pointer-events: none; z-index: 50; background: #050608; border: 1px solid var(--line-2); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; color: var(--ink-1); display: none; max-width: 280px; }
svg text { fill: var(--ink-3); font: 11px var(--sans); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.foot { margin-top: 28px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: no-preference) { .changed { animation: flash 1.2s ease-out; } }
@keyframes flash { from { background: rgba(201,169,97,.18); } to { background: transparent; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><b>JP-Libau <i>Holding</i></b><span>Command Center</span></div>
    <nav class="main" aria-label="Hoofdnavigatie">
      <a href="#overview">Overview</a><a href="#trading">Trading</a><a href="#intelligence">NEXUS Intelligence</a>
      <a href="#academy">Academy</a><a href="#control">CEO Control</a>
    </nav>
    <div class="fresh" id="fresh" aria-live="polite">gegevens laden…</div>
    <div class="links"><a href="stad.html">Stad</a><a href="factsheet.html">Factsheet</a><a href="jarvis.html">Brein</a></div>
  </div>
</header>
<main id="app" tabindex="-1"><p class="muted">Laden…</p></main>
<div class="tip" id="tip" role="tooltip"></div>
<script>
"use strict";
/* ── data en hulpjes ─────────────────────────────────────────────────────── */
const S = { state: null, om: null, snap: null, gh: {}, sim: { id: "market", k: 1 }, graph: { sel: null, types: null, desk: "", nature: "" } };
const DESK_COLOR = { crypto: "var(--d-crypto)", meme: "var(--d-meme)", stocks: "var(--d-stocks)", metals: "var(--d-metals)", fx: "var(--d-fx)" };
const STATUS = { HEALTHY: ["s-good", "●", "Gezond"], DEGRADED: ["s-warn", "▲", "Verminderd"], STALE: ["s-serious", "■", "Verouderd"],
  BLOCKED: ["s-crit", "✕", "Geblokkeerd"], UNKNOWN: ["s-unknown", "?", "Onbekend"] };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (d) => new Intl.NumberFormat("nl-NL", { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = (x, d = 2) => x == null ? "—" : "€ " + nf(d).format(x);
const pct = (x, d = 1, sign = true) => x == null || isNaN(x) ? "—" : (sign && x > 0 ? "+" : "") + nf(d).format(x * 100) + "%";
const cls = x => x == null ? "" : x > 0 ? "up" : x < 0 ? "down" : "";
const when = ts => { if (!ts) return "—"; const d = new Date(ts); return d.toLocaleString("nl-NL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const ageH = ts => ts ? (Date.now() - new Date(ts).getTime()) / 36e5 : null;
const ago = ts => { const h = ageH(ts); if (h == null) return "onbekend"; if (h < 1) return Math.max(1, Math.round(h * 60)) + " min geleden";
  if (h < 48) return nf(h < 10 ? 1 : 0).format(h) + " uur geleden"; return Math.round(h / 24) + " dagen geleden"; };
const status = (s, txt) => { const [c, i, l] = STATUS[s] || STATUS.UNKNOWN; return `<span class="status ${c}" data-i="${i}">${esc(txt || l)}</span>`; };
const label = t => `<span class="label">${esc(t)}</span>`;
const deskName = id => (S.state?.desks.find(d => d.id === id) || {}).name || id;
const deskDot = id => `<span class="dot" style="background:${DESK_COLOR[id] || "var(--ink-3)"}"></span>`;
const pulseStatus = p => { if (p.status === "BLOCKED" || p.healthy_h == null || !p.last_ts) return p.status;
  const a = ageH(p.last_ts); return a <= p.healthy_h ? "HEALTHY" : a <= p.stale_h ? "DEGRADED" : "STALE"; };
const empty = (title, why) => `<div class="empty"><b>${esc(title)}</b><br>${esc(why)}</div>`;

async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(url + " " + r.status); return r.json(); }
async function load() {
  const [st, om, sn] = await Promise.allSettled([getJSON("state.json"), getJSON("overmind.json"), getJSON("snapshot.json")]);
  if (st.status !== "fulfilled") { document.getElementById("app").innerHTML = empty("Geen gegevens", "state.json kon niet geladen worden. De bot publiceert die elk uur."); return; }
  S.state = st.value; S.om = om.status === "fulfilled" ? om.value : null; S.snap = sn.status === "fulfilled" ? sn.value : null;
  renderFresh(); route(); ghPulse();
}
function renderFresh() {
  const last = (S.state.total.equity_curve || []).slice(-1)[0]?.[0] || S.state.generated_at;
  const h = ageH(last); const st = h == null ? "UNKNOWN" : h <= 1.5 ? "HEALTHY" : h <= 3 ? "DEGRADED" : "STALE";
  document.getElementById("fresh").innerHTML = `${status(st, st === "HEALTHY" ? "Actueel" : STATUS[st][2])}<span>ronde ${esc(when(last))}</span>${S.state.demo ? label("simulated") : label("paper · vertraagd")}`;
}
/* Publieke GitHub-gegevens over de laatste runs: echt runtime-bewijs voor Jarvis en publicatie. */
async function ghPulse() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/); const repo = location.pathname.split("/").filter(Boolean)[0];
  if (!m || !repo) return;
  for (const [id, wf] of [["jarvis", "jarvis.yml"], ["publish", "paper.yml"]]) {
    try { const r = await getJSON(`https://api.github.com/repos/${m[1]}/${repo}/actions/workflows/${wf}/runs?per_page=1&status=completed`);
      const run = r.workflow_runs?.[0]; if (run) S.gh[id] = { ts: run.updated_at, ok: run.conclusion === "success", conclusion: run.conclusion };
    } catch (e) { S.gh[id] = { error: true }; }
  }
  if (["overview", "control"].includes(currentRoute()[0])) route();
}

/* ── router ─────────────────────────────────────────────────────────────── */
const ROUTES = { overview: renderOverview, trading: renderTrading, intelligence: renderIntel, academy: renderAcademy, control: renderControl };
const currentRoute = () => (location.hash.slice(1) || "overview").split("/");
function route() {
  if (!S.state) return;
  const [r, ...rest] = currentRoute(); const fn = ROUTES[r] || renderOverview;
  document.querySelectorAll("nav.main a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + (ROUTES[r] ? r : "overview") ? "page" : "false"));
  const app = document.getElementById("app"); app.innerHTML = fn(rest); afterRender(r, rest);
}
window.addEventListener("hashchange", () => { route(); document.getElementById("app").focus({ preventScroll: true }); window.scrollTo(0, 0); });
const go = (h) => `#${h}`;

/* ── grafieken (SVG, met hover) ─────────────────────────────────────────── */
function lineChart(id, series, opts = {}) {
  const W = 760, H = opts.h || 220, P = { l: 56, r: 64, t: 12, b: 24 };
  const pts = series.flatMap(s => s.data); if (pts.length < 2) return empty("Te weinig punten", "Er is nog geen curve om te tekenen.");
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs); let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * .08 || 1; y0 -= pad; y1 += pad;
  const X = t => P.l + (t - x0) / (x1 - x0 || 1) * (W - P.l - P.r), Y = v => H - P.b - (v - y0) / (y1 - y0) * (H - P.t - P.b);
  const ticks = [0, .25, .5, .75, 1].map(f => y0 + f * (y1 - y0));
  let g = ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(opts.fmt ? opts.fmt(v) : nf(0).format(v))}</text>`).join("");
  g += [x0, (x0 + x1) / 2, x1].map((t, i) => `<text x="${X(t)}" y="${H - 6}" text-anchor="${["start", "middle", "end"][i]}">${esc(new Date(t).toLocaleDateString("nl-NL", { day: "numeric", month: "short" }))}</text>`).join("");
  for (const s of series) {
    const d = s.data.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="4 4"' : ""}/>`;
    const last = s.data[s.data.length - 1];
    g += `<text x="${X(last[0]) + 6}" y="${Y(last[1]) + 4}" style="fill:var(--ink-2)">${esc(s.name)}</text>`;
  }
  g += `<line id="${id}-x" y1="${P.t}" y2="${H - P.b}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
  g += `<rect x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent" data-chart="${id}"/>`;
  CHARTS[id] = { series, X, x0, x1, P, W, fmt: opts.fmt };
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label || "grafiek")}">${g}</svg>`;
}
const CHARTS = {};
document.addEventListener("pointermove", e => {
  const tip = document.getElementById("tip"); const t = e.target;
  if (t.dataset && t.dataset.chart) {
    const c = CHARTS[t.dataset.chart]; const svg = t.ownerSVGElement; const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse()); const tt = c.x0 + (p.x - c.P.l) / (c.W - c.P.l - c.P.r) * (c.x1 - c.x0);
    const rows = c.series.map(s => { let best = s.data[0]; for (const q of s.data) if (Math.abs(q[0] - tt) < Math.abs(best[0] - tt)) best = q; return [s, best]; });
    const ln = svg.getElementById(t.dataset.chart + "-x"); ln.setAttribute("x1", c.X(rows[0][1][0])); ln.setAttribute("x2", c.X(rows[0][1][0])); ln.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="muted">${esc(when(rows[0][1][0]))}</div>` + rows.map(([s, q]) => `<div><span class="dot" style="background:${s.color}"></span> ${esc(s.name)}: <b class="num">${esc(c.fmt ? c.fmt(q[1]) : q[1])}</b></div>`).join("");
    show(tip, e);
  } else if (t.closest && t.closest("[data-tip]")) { tip.innerHTML = t.closest("[data-tip]").dataset.tip; show(tip, e); }
  else { tip.style.display = "none"; document.querySelectorAll('line[id$="-x"]').forEach(l => l.setAttribute("visibility", "hidden")); }
});
function show(tip, e) { tip.style.display = "block"; const w = tip.offsetWidth; tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + "px"; tip.style.top = (e.clientY + 14) + "px"; }

function barRows(rows, fmt, opts = {}) {      // horizontale staven rond nul; label en waarde in tekstinkt
  const m = Math.max(1e-9, ...rows.map(r => Math.abs(r.v ?? 0))); const oneSided = rows.every(r => (r.v ?? 0) <= 0);
  const mid = oneSided ? 100 : 50, span = oneSided ? 100 : 50;
  return `<div role="table" aria-label="${esc(opts.label || "")}">` + rows.map(r => {
    const w = Math.abs(r.v ?? 0) / m * span; const neg = (r.v ?? 0) < 0;
    return `<div role="row" class="spread" style="gap:12px;margin:6px 0" data-tip="${esc(r.name)}: ${esc(fmt(r.v))}${r.note ? " · " + esc(r.note) : ""}">
      <span role="cell" style="width:120px;flex:none" class="row">${r.dot || ""}${esc(r.name)}</span>
      <span style="flex:1;position:relative;height:14px"><span style="position:absolute;left:${mid}%;top:-2px;bottom:-2px;width:1px;background:var(--axis)"></span>
        <span style="position:absolute;top:2px;height:10px;${neg ? `right:${100 - mid}%` : `left:${mid}%`};width:${w}%;background:${r.color || "var(--ink-3)"};border-radius:${neg ? "4px 0 0 4px" : "0 4px 4px 0"}"></span></span>
      <span role="cell" class="num ${cls(r.v)}" style="width:80px;text-align:right">${esc(fmt(r.v))}</span></div>`;
  }).join("") + "</div>";
}

/* ── OVERVIEW ───────────────────────────────────────────────────────────── */
function attentionList(items) {
  const col = { critical: "var(--crit)", change: "var(--warn)", context: "var(--ink-3)" };
  const sec = { overview: "overview", trading: "trading", intelligence: "intelligence", academy: "academy", control: "control" };
  return items.map(a => `<div class="att"><span class="bar-l" style="background:${col[a.level]}"></span>
    <div><div class="t">${esc(a.title)}</div><div class="d">${esc(a.detail)} <span class="muted">· bron: ${esc(a.source)}</span></div></div>
    <a class="go" href="#${a.replay ? "control/replay/" + encodeURIComponent(a.replay) : (sec[a.section] || "overview") + (a.desk ? "/" + a.desk : "")}">bekijk →</a></div>`).join("");
}
function renderOverview() {
  const st = S.state, t = st.total, om = S.om;
  const bench = t.benchmark_eur ? t.benchmark_eur / t.capital_eur - 1 : null;
  const invested = om ? om.exposure.invested_eur / (om.exposure.equity_eur || 1) : null;
  const att = om ? om.attention : [];
  const crit = att.filter(a => a.level === "critical"), chg = att.filter(a => a.level === "change"), ctx = att.filter(a => a.level === "context");
  const curve = (t.equity_curve || []).map(p => [new Date(p[0]).getTime(), p[1]]);
  const pulse = om ? om.pulse.map(p => ({ ...p, live: liveStatus(p) })) : [];

function drawGraph() {
  const host = document.getElementById("graph"); if (!host) return; const G = S.om.graph;
  const order = ["department", "asset", "strategy", "decision", "risk", "finding", "rule", "challenger", "event", "research", "source"];
  let edges = G.edges.filter(e => !S.graph.nature || e.nature === S.graph.nature);
  let nodes = G.nodes.filter(n => S.graph.types.has(n.type));
  if (S.graph.desk) {         // alles binnen twee stappen van de gekozen afdeling
    const keep = new Set(["desk:" + S.graph.desk]);
    for (let k = 0; k < 2; k++) edges.forEach(e => { if (keep.has(e.source)) keep.add(e.target); if (keep.has(e.target)) keep.add(e.source); });
    nodes = nodes.filter(n => keep.has(n.id));
  }
  const ids = new Set(nodes.map(n => n.id)); edges = edges.filter(e => ids.has(e.source) && ids.has(e.target));
  const cols = order.filter(t => nodes.some(n => n.type === t)); if (!nodes.length) { host.innerHTML = empty("Niets te tonen", "Pas de filters aan."); return; }
  const W = Math.max(640, cols.length * 150), rowH = 22; const maxN = Math.max(...cols.map(c => nodes.filter(n => n.type === c).length)); const H = Math.max(260, maxN * rowH + 40);
  const pos = {}; cols.forEach((c, ci) => { const ns = nodes.filter(n => n.type === c); ns.forEach((n, i) => pos[n.id] = [40 + ci * (W - 80) / Math.max(1, cols.length - 1), 30 + (i + .5) * (H - 40) / ns.length]); });
  const sel = S.graph.sel; const nb = new Set(); if (sel) edges.forEach(e => { if (e.source === sel) nb.add(e.target); if (e.target === sel) nb.add(e.source); });

  const lim = ex.limit_drawdown;
  const desks = S.state.desks.map(d => { const loss = shock[d.id] || 0; const after = (ex.desk_equity[d.id] || 0) + loss; const peak = ex.desk_peak[d.id] || after;
    return { id: d.id, name: d.name, loss, after, dd: peak ? 1 - after / peak : 0, breach: !ex.desk_paused[d.id] && peak && 1 - after / peak >= lim, paused: ex.desk_paused[d.id] }; });
  const tot = desks.reduce((a, d) => a + d.loss, 0); return { desks, tot, after: ex.equity_eur + tot };
}
function ctlRisk() {
  const om = S.om; if (!om) return empty("Geen gegevens", "overmind.json ontbreekt.");
  const sc = om.scenarios.find(s => s.id === S.sim.id) || om.scenarios[0]; const r = simulate(sc, S.sim.k);
  return `<section class="card"><h2>Risk Simulator</h2><p class="sub" style="margin-top:0">Wat gebeurt er met de huidige posities bij een vaste schok? <b>Geen kansvoorspelling</b>, alleen rekenen met aannames. Leest alleen: er verandert niets aan posities, pauzes of limieten.</p>
  <div class="row" style="margin-bottom:12px">${om.scenarios.map(s => `<button aria-pressed="${s.id === sc.id}" data-scn="${s.id}">${esc(s.name)}</button>`).join("")}<button data-reset="1">Reset</button></div>
  <label class="sub" for="sk">Schaal van de schok: <b class="num" id="skv">${nf(1).format(S.sim.k)}×</b></label><input id="sk" type="range" min="0.5" max="2" step="0.1" value="${S.sim.k}">
  <p class="layer rcn" style="margin:12px 0"><b>Aanname:</b> ${esc(sc.assumption)} ${S.sim.k !== 1 ? `(× ${nf(1).format(S.sim.k)})` : ""}</p>
  <div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="l">Holding nu</div><div class="v num">${eur(om.exposure.equity_eur)}</div></div><div class="kpi"><div class="l">Effect</div><div class="v num ${cls(r.tot)}">${eur(r.tot)}</div><div class="s">${pct(r.tot / om.exposure.equity_eur)}</div></div><div class="kpi"><div class="l">Daarna</div><div class="v num">${eur(r.after)}</div></div><div class="kpi"><div class="l">Nieuwe pauzes</div><div class="v num">${r.desks.filter(d => d.breach).length}</div><div class="s">grens ${pct(-om.exposure.limit_drawdown, 0)} vanaf top</div></div></div>
  ${barRows(r.desks.map(d => ({ name: d.name, v: d.loss, color: DESK_COLOR[d.id], dot: deskDot(d.id), note: d.paused ? "staat al stil (cash)" : d.breach ? "zou de pauzegrens raken" : "daling vanaf top " + pct(-d.dd) })), v => eur(v), { label: "Effect per afdeling" })}
  <table style="margin-top:10px"><thead><tr><th>Afdeling</th><th class="r">Effect</th><th class="r">Daling vanaf top</th><th>Gevolg</th></tr></thead><tbody>${r.desks.map(d => `<tr><td>${esc(d.name)}</td><td class="r num ${cls(d.loss)}">${eur(d.loss)}</td><td class="r num">${pct(-d.dd)}</td><td>${d.paused ? label("al gepauzeerd") : d.breach ? status("BLOCKED", "pauzegrens") : status("HEALTHY", "binnen grens")}</td></tr>`).join("")}</tbody></table>
  <p class="muted" style="font-size:12px">Bron: posities uit de laatste ronde (${esc(when(S.state.generated_at))}). Activaklasse en munt komen uit de config. Reproduceerbaar: dezelfde invoer geeft dezelfde uitkomst.</p></section>`;
}
function ctlAudit() {
  const om = S.om; if (!om) return empty("Geen gegevens", "overmind.json ontbreekt.");
  const ev = om.replay.filter(r => r.kind !== "decision");
  return `<section class="card"><h2>Audit: pauzes, hervattingen en strategiewissels</h2><p class="sub" style="margin-top:0">Uit de logboeken van de afdelingen. Dit scherm past niets aan; originele records blijven zoals ze zijn.</p>
  <table><thead><tr><th>Wanneer</th><th>Afdeling</th><th>Wat</th><th></th></tr></thead><tbody>${ev.map(r => `<tr><td class="num muted">${esc(when(r.ts))}</td><td>${deskDot(r.desk)} ${esc(deskName(r.desk))}</td><td>${esc(replayTitle(r))}<div class="sub" style="font-size:12px">${esc(r.recorded.reason || "")}</div></td><td><a href="#control/replay/${encodeURIComponent(r.id)}">bekijk →</a></td></tr>`).join("")}</tbody></table></section>`;
}

/* ── na het tekenen: interactie ─────────────────────────────────────────── */
function afterRender(r, rest) {
  if (r === "intelligence" && rest[0] === "graph" && S.om) {
    drawGraph(); if (S.graph.sel) side();
    document.querySelectorAll("[data-gtype]").forEach(b => b.onclick = () => { const t = b.dataset.gtype; S.graph.types.has(t) ? S.graph.types.delete(t) : S.graph.types.add(t); b.setAttribute("aria-pressed", S.graph.types.has(t)); drawGraph(); });
    document.getElementById("gdesk").onchange = e => { S.graph.desk = e.target.value; drawGraph(); };
    document.getElementById("gnature").onchange = e => { S.graph.nature = e.target.value; drawGraph(); };
  }
  if (r === "control" && rest[0] === "risk") {
    document.querySelectorAll("[data-scn]").forEach(b => b.onclick = () => { S.sim.id = b.dataset.scn; route(); });
    const rs = document.querySelector("[data-reset]"); if (rs) rs.onclick = () => { S.sim = { id: "market", k: 1 }; route(); };
    const sk = document.getElementById("sk"); if (sk) sk.onchange = e => { S.sim.k = +e.target.value; route(); };
  }
}
load();
</script>
