<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JP-libau HQ</title>
<style>
:root{
  --ink:#f4ecd8; --dim:#b9ad93; --bg:#141022; --panel:#1f1934; --panel2:#2a2245; --edge:#4b3f7a;
  --gold:#ffcc4d; --good:#5fe08a; --bad:#ff5d6c; --warn:#ffb347; --blue:#5ab8ff; --purple:#b07cff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Courier New",ui-monospace,monospace;font-size:14px;overflow:hidden}
.px{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh}
/* koersband */
#tape{overflow:hidden;white-space:nowrap;background:#0b0816;border-bottom:2px solid #3a2f63;height:26px;position:relative}
#tape .run{display:inline-flex;gap:26px;padding-left:26px;animation:tape var(--dur,80s) linear infinite;line-height:26px}
#tape:hover .run{animation-play-state:paused}
#tape .tk{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
#tape .tk b{color:var(--ink)} #tape .tk .p{color:var(--dim)} #tape .tk.closed{opacity:.55}
#tape .tk svg{width:42px;height:14px}
#tape .dot{width:6px;height:6px;display:inline-block}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* HUD */
#hud{display:flex;align-items:center;gap:18px;padding:10px 16px;background:linear-gradient(#2a2245,#1f1934);
  border-bottom:4px solid #0b0816;box-shadow:0 4px 0 #3a2f63 inset}
#logo{display:flex;align-items:center;gap:10px}
#logo .crest{width:36px;height:36px;background:var(--gold);color:#2a1a00;display:grid;place-items:center;
  font-weight:900;font-size:15px;box-shadow:0 0 0 3px #2a1a00,0 0 0 6px var(--gold);image-rendering:pixelated}
#logo .t1{font-size:16px} #logo .t2{font-size:11px;color:var(--dim)}
.stat{display:flex;flex-direction:column;gap:4px;min-width:150px}
.stat .lbl{font-size:10px;color:var(--dim)}
.stat .val{font-size:20px}
.bar{height:14px;background:#0b0816;border:2px solid #0b0816;box-shadow:0 0 0 2px var(--edge);position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;display:block;background:var(--good);
  background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.18) 6px 8px)}
.bar.en>i{background-color:var(--blue)} .bar.xp>i{background-color:var(--purple)}
.badge{padding:5px 9px;border:2px solid currentColor;font-size:11px}
.badge.paper{color:var(--blue)} .badge.kill{color:var(--bad);animation:blink 1s steps(2) infinite}
.badge.demo{color:var(--warn)}
.badge.fact{color:var(--gold);text-decoration:none}
.badge.auto{color:var(--good);cursor:pointer} .badge.auto.warn{color:var(--warn)} .badge.auto.alarm{color:var(--bad);animation:blink 1s steps(2) infinite}
#hud .spacer{flex:1}
.badge.jarvis{color:#5ee7ff;cursor:pointer} .badge.jarvis.warn{color:var(--warn)} .badge.jarvis.alarm{color:var(--bad);animation:blink 1s steps(2) infinite}
/* Jarvis */
.jarvis-card{border:2px solid #5ee7ff;background:linear-gradient(160deg,#0b2233,#0b0816);box-shadow:0 0 14px rgba(94,231,255,.25);
  padding:12px;margin:10px 0;position:relative}
.jarvis-card .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.arc{width:26px;height:26px;border-radius:50%;border:3px solid #5ee7ff;box-shadow:0 0 10px #5ee7ff,inset 0 0 8px #5ee7ff;
  animation:pulse 2.4s ease-in-out infinite;flex:none}
.arc.warn{border-color:var(--warn);box-shadow:0 0 10px var(--warn),inset 0 0 8px var(--warn)}
.arc.alarm{border-color:var(--bad);box-shadow:0 0 10px var(--bad),inset 0 0 8px var(--bad)}
@keyframes pulse{50%{transform:scale(.85);opacity:.7}}
.jarvis-card ul{margin:4px 0 8px 16px;padding:0} .jarvis-card li{margin:3px 0;line-height:1.35}
.jarvis-card button{background:#0b0816;color:#5ee7ff;border:2px solid #5ee7ff;padding:4px 10px;font:inherit;cursor:pointer}
@keyframes blink{50%{opacity:.25}}

/* Wereld */
#main{display:grid;grid-template-columns:1fr 380px;min-height:0}
#world{position:relative;min-height:0;overflow:hidden;background:#123a5c}
#world canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:pointer}
#labels,#bubbles{position:absolute;inset:0;pointer-events:none}
.sign{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  background:#1f1934ee;border:2px solid #0b0816;box-shadow:0 0 0 2px var(--edge);padding:4px 7px;
  font-size:11px;white-space:nowrap;text-align:center}
.sign b{display:block;font-size:12px}
.sign.shadow{opacity:.85;border-style:dashed;box-shadow:0 0 0 2px #c9a36b;font-size:10px}
.sign.shadow b{font-size:10px;color:#ffcc4d}
.sign .lv{color:var(--purple)} .sign .up{color:var(--good)} .sign .dn{color:var(--bad)}
.sign.sel{box-shadow:0 0 0 2px var(--gold)}
.sign.alarm{box-shadow:0 0 0 2px var(--bad);animation:blink .8s steps(2) infinite}
#weather{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--dim);background:#0b0816aa;padding:4px 8px}

/* Zijpaneel */
#side{background:var(--panel);border-left:4px solid #0b0816;overflow:auto;padding:14px}
#side h2{margin:0 0 4px;font-size:18px} #side h3{margin:16px 0 6px;font-size:12px;color:var(--dim)}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.card{background:var(--panel2);border:2px solid #0b0816;box-shadow:0 0 0 2px var(--edge) inset;padding:10px;margin:8px 0}
.big{font-size:24px}
.up{color:var(--good)} .dn{color:var(--bad)} .mute{color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 3px;text-align:left;border-bottom:1px dashed #3a2f63} th{color:var(--dim);font-weight:400}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:1px 5px;border:1px solid var(--edge);font-size:10px;color:var(--dim)}
.pill.in{color:var(--good);border-color:var(--good)}
canvas.spark{width:100%;height:90px;image-rendering:pixelated;display:block}
.whatif select,.whatif input[type=number]{background:#0b0816;color:inherit;border:1px solid #3a2f63;font:inherit;padding:3px 5px;max-width:100%}
.whatif input[type=range]{width:100%;accent-color:#d9a521}
.whatif .legend i{display:inline-block;width:10px;height:3px;margin:0 4px 2px 8px;vertical-align:middle}
.org{font-size:11px}
.org .lvl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;position:relative;padding-top:10px}
.org .lvl:first-child{padding-top:0}
.org .lvl:not(:first-child)::before{content:"";position:absolute;top:1px;left:50%;height:8px;border-left:2px solid var(--edge)}
.org .who{background:#0b0816;border:2px solid var(--edge);padding:4px 6px;text-align:center;min-width:72px;cursor:pointer}
.org .who b{display:block;font-size:11px} .org .who span{color:var(--dim);font-size:10px}
.org .who.ceo{border-color:var(--gold)} .org .who.ghost{border-style:dashed;opacity:.8;cursor:default}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;background:#0b0816;color:var(--ink);border:2px solid var(--edge);padding:6px;font:inherit;
  font-size:11px;cursor:pointer}
.tabs button.on{border-color:var(--gold);color:var(--gold)}

/* Onderbalk */
#bottom{display:grid;grid-template-columns:1fr 380px;height:210px;border-top:4px solid #0b0816}
#feed{background:#0e0b1a;overflow:auto;padding:8px 14px;font-size:12px}
#feed .msg{padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
#feed .t{color:var(--dim)} #feed .who{font-weight:700}
#feed .trade .txt{color:var(--good)} #feed .refused .txt{color:var(--warn)}
#feed .pause .txt{color:var(--bad)} #feed .selection .txt{color:var(--purple)}
#feed .reflection .txt{color:var(--blue)} #feed .weekreport .txt{color:var(--gold)} #feed .alert .txt{color:#ff9de2}
#feed .msg{cursor:pointer} #feed .msg .det{display:none;white-space:normal;color:var(--dim);padding:2px 0 4px 16px}
#feed .msg.open{white-space:normal} #feed .msg.open .det{display:block}
.lvl-groot{color:var(--bad)} .lvl-let_op{color:var(--warn)} .lvl-info{color:var(--blue)}
.lesson{margin:2px 0 0 10px;color:var(--dim);font-size:11px}
#quests{background:var(--panel);border-left:4px solid #0b0816;overflow:auto;padding:8px 14px}
.quest{margin:6px 0} .quest .qt{display:flex;justify-content:space-between;font-size:12px}
.quest .bar{height:10px;margin-top:3px} .quest.done .qt{color:var(--good)}
.quest.locked{opacity:.65}
.hint{font-size:10px;color:var(--dim)}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#f4ecd8;color:#1f1934;font-size:11px;
  padding:4px 7px;border:2px solid #0b0816;max-width:190px;white-space:normal;pointer-events:none;
  animation:pop .25s steps(3)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;border:4px solid transparent;border-top-color:#0b0816}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.6);opacity:0}}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--gold);color:#2a1a00;padding:10px 16px;
  border:3px solid #2a1a00;box-shadow:0 0 0 3px var(--gold);font-weight:700;display:none;z-index:9;text-align:center}
#toast.show{display:block;animation:pop .3s steps(3)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.bdg{width:30px;height:30px;display:grid;place-items:center;font-size:16px;background:#0b0816;border:2px solid var(--edge);
  filter:grayscale(1);opacity:.35} .bdg.got{filter:none;opacity:1;border-color:var(--gold)}
@media (max-width: 900px){
  html,body{overflow:visible;height:auto}
  #app{height:auto}
  #hud{flex-wrap:wrap;gap:10px} .stat{min-width:120px} #hud .spacer{display:none}
  #main{grid-template-columns:1fr} #world{height:56vh}
  #side{border-left:0;border-top:4px solid #0b0816;overflow:visible}
  #bottom{grid-template-columns:1fr;height:auto} #feed{max-height:260px} #quests{border-left:0}
  .sign{font-size:9px;padding:2px 4px} .sign b{font-size:9px} .sign .lv,.sign .up,.sign .dn{font-size:8px}
  .bubble{font-size:9px;max-width:140px}
}
#err{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:#0b0816;padding:16px;
  border:2px solid var(--bad);display:none;max-width:420px}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app">
  <header id="hud">
    <div id="logo"><div class="crest px">JP</div><div><div class="t1 px">JP-libau Holding</div><div class="t2">Hoofdkwartier</div></div></div>
    <div class="stat"><span class="lbl px">Schatkist</span><span class="val" id="h-eq">…</span><span class="hint" id="h-pnl"></span></div>
    <div class="stat"><span class="lbl px">Risicoruimte</span><div class="bar hp"><i id="h-hp"></i></div><span class="hint" id="h-hpt"></span></div>
    <div class="stat"><span class="lbl px">Dagbudget</span><div class="bar en"><i id="h-en"></i></div><span class="hint" id="h-ent"></span></div>
    <div class="stat"><span class="lbl px">Demofase</span><div class="bar xp"><i id="h-day"></i></div><span class="hint" id="h-dayt"></span></div>
    <div class="spacer"></div>
    <span class="badge px demo" id="b-demo" hidden>Nep-data</span>
    <span class="badge px jarvis" id="b-jarvis" onclick="select('hq')" title="Jarvis bewaakt de holding">JARVIS</span>
    <span class="badge px auto" id="b-auto" onclick="select('risk')" title="Autopiloot: elk uur een ronde, Jarvis kijkt elke 10 minuten">AUTO</span>
    <a class="badge px fact" href="factsheet.html" title="Maandfactsheet: één pagina met alle cijfers, ook als pdf">Factsheet</a>
    <span class="badge px paper">Paper</span>
    <span class="badge px kill" id="b-kill" hidden>Noodstop</span>
    <div class="stat" style="min-width:110px;text-align:right"><span class="lbl px">Laatste ronde</span><span id="h-time" class="hint"></span></div>
  </header>

  <div id="tape" title="Koersen van het laatste uur. Beweging over 24 uur."><div class="run" id="tape-run"></div></div>

  <div id="main">
    <div id="world"><canvas id="cv"></canvas><div id="labels"></div><div id="bubbles"></div><div id="weather"></div><div id="err"></div></div>
    <aside id="side"></aside>
  </div>

  <div id="bottom">
    <div id="feed"></div>
    <div id="quests"></div>
  </div>
</div>

<script>
"use strict";
const W = 320, H = 180;           // wereld in "pixels"; wordt opgeschaald
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let S = null, selected = "hq", tick = 0, scale = 3, offX = 0, offY = 0;

const eur = (v, d = 2) => v == null ? "–" : "€" + Number(v).toLocaleString("nl-NL", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (v, d = 1) => v == null ? "–" : (v >= 0 ? "+" : "") + (v * 100).toFixed(d).replace(".", ",") + "%";
const cls = v => v == null ? "mute" : v >= 0 ? "up" : "dn";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
// "trend(fast=50, slow=100, band=0.01)" -> "trend 50/100"
const strat = t => String(t ?? "")
  .replace(/koop_en_houd/g, "koop-en-houd")
  .replace(/trend\(fast=(\d+), slow=(\d+)[^)]*\)/g, "trend $1/$2")
  .replace(/momentum\(lookback=(\d+)[^)]*\)/g, "momentum $1d")
  .replace(/uitbraak\(entry=(\d+), exit=(\d+)\)/g, "uitbraak $1/$2")
  .replace(/terugkeer\(period=\d+, low=(\d+), high=(\d+)\)/g, "terugkeer $1/$2")
  .replace(/ \(Sharpe [^)]*\)/g, "").replace(/weekkeuze strategieën: /, "nieuwe keuze: ");
const tiny = v => v == null ? "–" : v < 0.01 ? v.toPrecision(3) : v.toLocaleString("nl-NL", {maximumFractionDigits: 2});
const when = iso => { const d = new Date(iso); return d.toLocaleString("nl-NL", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}); };

// ------------------------------------------------------------------ gebouwen
// x,y = linksonder in wereldpixels; w,h = maat van de gevel
const B = {
  crypto: {x: 62, y: 86, w: 34, h: 26, wall: "#2bb3a3", roof: "#16675e", label: "Crypto Lab"},
  meme:   {x: 112, y: 64, w: 30, h: 22, wall: "#8b4fd8", roof: "#4b2585", label: "Meme Arcade"},
  stocks: {x: 196, y: 70, w: 22, h: 46, wall: "#8a95ad", roof: "#4a536a", label: "Beurstoren"},
  metals: {x: 230, y: 112, w: 32, h: 22, wall: "#d9a521", roof: "#7a5a0c", label: "De Kluis"},
  fx:     {x: 46, y: 138, w: 38, h: 18, wall: "#3f7fd6", roof: "#1f4a86", label: "Wisselhaven"},
  risk:   {x: 262, y: 74, w: 12, h: 40, wall: "#b84a4a", roof: "#5e1f1f", label: "Wachttoren"},
  lab:    {x: 150, y: 120, w: 30, h: 18, wall: "#e8e4f0", roof: "#9c95b5", label: "Onderzoekslab"},
  hq:     {x: 146, y: 96, w: 0, h: 0, label: "HQ"},
};
const DESKS = ["crypto", "meme", "stocks", "metals", "fx"];
// bouwplaatsen voor de schaduw-afdelingen: ze groeien mee met de 90 dagen proef
const P = {
  schatkist:    {x: 102, y: 126, w: 18, h: 14, wall: "#cfd6e6", label: "De Schatkist"},
  obligaties:   {x: 186, y: 142, w: 20, h: 14, wall: "#a7c4e8", label: "Obligatiebank"},
  vastgoed:     {x: 140, y: 160, w: 16, h: 16, wall: "#e2a77a", label: "Vastgoedkantoor"},
  grondstoffen: {x: 224, y: 152, w: 22, h: 12, wall: "#b98a5e", label: "Grondstoffenhal"},
};
const shadows = () => (S && S.arena && S.arena.shadow) || [];
const desk = id => S && S.desks.find(d => d.id === id);

function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

// Echte dag en nacht in Amsterdam: zonsopgang en -ondergang schuiven mee met de seizoenen.
function amsHour() {
  const parts = new Intl.DateTimeFormat("nl-NL", {timeZone: "Europe/Amsterdam", hour: "numeric", minute: "numeric", hourCycle: "h23"}).formatToParts(new Date());
  const get = t => +(parts.find(p => p.type === t) || {value: 0}).value;
  return get("hour") + get("minute") / 60;
}
let SUN = null, sunAt = 0;
function sunTimes() {
  if (SUN && Date.now() - sunAt < 60e3) return SUN;
  const now = new Date(), doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5);
  const len = 12.2 + 4.4 * Math.sin(2 * Math.PI * (doy - 80) / 365);      // daglengte Amsterdam: ~7,8 tot ~16,6 uur
  const summer = new Intl.DateTimeFormat("en", {timeZone: "Europe/Amsterdam", timeZoneName: "short"}).format(now).includes("+2");
  const noon = summer ? 13.7 : 12.7;
  SUN = {rise: noon - len / 2, set: noon + len / 2, h: amsHour()};
  sunAt = Date.now();
  return SUN;
}
// 0 = volle dag, 1 = diepe nacht; een uur schemer rond op- en ondergang
function darkness() {
  const {rise, set, h} = sunTimes();
  if (h >= rise + .75 && h <= set - .75) return 0;
  if (h <= rise - .75 || h >= set + .75) return 1;
  return h < 12 ? (rise + .75 - h) / 1.5 : (h - (set - .75)) / 1.5;
}
function night() { return darkness() > .5; }

function drawWater() {
  const n = night();
  rect(0, 0, W, H, n ? "#0d2440" : "#1e5f8f");
  ctx.globalAlpha = .35;
  for (let i = 0; i < 70; i++) {
    const x = (i * 53 + tick * (i % 3 + 1) * .15) % (W + 10) - 5, y = (i * 37) % H;
    rect(x, y, 4, 1, n ? "#2c5b8a" : "#7fc4ef");
  }
  ctx.globalAlpha = 1;
}

function blob(cx, cy, rx, ry, c, wob) {
  for (let y = -ry; y <= ry; y++) {
    const k = Math.sqrt(1 - (y * y) / (ry * ry));
    const w = rx * k + Math.sin(y * .35 + wob);
    rect(cx - w, cy + y, w * 2, 1, c);
  }
}

// ------------------------------------------------------------------ de stad (pixel-Manhattan)
const ISLE = {cx: 160, cy: 104, rx: 136, ry: 70};
const inIsle = (x, y, m = 0) => ((x - ISLE.cx) / (ISLE.rx - m)) ** 2 + ((y - ISLE.cy) / (ISLE.ry - m)) ** 2 < 1;
const AVENUES = [44, 92, 128, 156];          // straten van west naar oost (y)
const STREETS = [90, 126, 196, 232, 278];   // straten van noord naar zuid (x)
const PARK = {x: 134, y: 84, w: 52, h: 22};  // park met fontein en standbeeld in het midden
const hash = n => { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; };
let FILLER = null;
function fillers() {
  // kleine wolkenkrabbers in de lege blokken, nooit op een afdeling, bouwplaats, park of straat
  if (FILLER) return FILLER;
  const taken = [...Object.values(B).filter(b => b.w), ...Object.values(P)].map(b => [b.x - 3, b.y - b.h - 6, b.w + 6, b.h + 9]);
  taken.push([PARK.x - 2, PARK.y - 2, PARK.w + 4, PARK.h + 4], [278, 88, 42, 30], [BB.x - 2, BB.y - 2, BB.w + 4, BB.h + 8]);
  const free = (x, y, w, h) => !taken.some(([tx, ty, tw, th]) => x < tx + tw && x + w > tx && y - h < ty + th && y > ty)
    && !AVENUES.some(a => a > y - 4 && a < y + 4) && !STREETS.some(sx => sx > x - 3 && sx < x + w + 3);
  FILLER = [];
  for (let gy = 38; gy <= 172; gy += 7)
    for (let gx = 26; gx <= 296; gx += 8) {
      const r = hash(gx * 131 + gy * 7), w = 6 + Math.floor(r * 5), h = 8 + Math.floor(hash(gx + gy * 977) ** 1.6 * 30);
      const x = gx + Math.floor(hash(gy * 31 + gx) * 4), y = gy;
      if (!inIsle(x, y, 9) || !inIsle(x + w, y, 9)) continue;
      if (!free(x, y, w, h)) continue;
      FILLER.push({x, y, w, h, c: ["#7d7f8c", "#8c7a6b", "#6b8aa8", "#a39888", "#5d6170", "#4f7fa0", "#b0a48e"][Math.floor(r * 7)], glass: r > .7, seed: gx * 3 + gy});
      taken.push([x - 1, y - h, w + 2, h + 2]);
    }
  FILLER.sort((a, b) => a.y - b.y);
  return FILLER;
}

function drawIsland() {
  const n = night();
  blob(ISLE.cx, ISLE.cy, ISLE.rx, ISLE.ry, n ? "#4a4c58" : "#8d8f99", 1);           // kademuur
  blob(ISLE.cx, ISLE.cy - 1, ISLE.rx - 4, ISLE.ry - 4, n ? "#3a3c46" : "#b9b6ad", 2); // trottoir

  for (const k of (S.ticker || []).slice(0, 6)) msgs.push(`${k.name.toUpperCase()} ${(k.change ?? 0) >= 0 ? "▲" : "▼"}${pct(k.change)}`);

function plot(id, sd) {
  const b = P[id];
  if (!b) return;
  const n = night(), t = tick;
  const grow = Math.max(.12, Math.min(1, (sd.days || 0) / 90));       // bouwt mee met de proef
  rect(b.x - 3, b.y - 2, b.w + 6, 4, n ? "#5a4630" : "#8a6a42");        // bouwgrond
  for (let x = b.x - 3; x <= b.x + b.w + 3; x += 3) rect(x, b.y - 4, 1, 2, "#e8c26a"); // hekje
  const hh = Math.round(b.h * grow), top = b.y - hh;

  for (let y = top + 2; y < b.y - 1; y += 3) rect(b.x, y, b.w, 1, "rgba(0,0,0,.12)");

}

function shade(hex, k) {           // k > 0 lichter, k < 0 donkerder

}

  rect(x, y, w, h, c);

}

// Gebouwen groeien mee met het resultaat: elke 2,5% winst een verdieping erbij (max 8, binnen beeld).

function floors(d) { return d && d.pnl_pct > 0 ? Math.min(8, Math.floor(d.pnl_pct * 100 / 2.5)) : 0; }
function geo(id) {

  const g = Math.min(floors(d), Math.floor(Math.max(0, room) / 3)) * 3;
  return g ? {...b, h: b.h + g, extra: g / 3} : b;
}
function scaffold(b, top) {
  const c = "#c9a36b";
  for (const x of [b.x - 2, b.x + b.w + 1]) rect(x, top + 2, 1, b.h - 2, c);
  for (let y = top + 4; y < b.y - 2; y += 6) { rect(b.x - 2, y, b.w + 4, 1, c); rect(b.x + b.w - 6, y - 2, 3, 2, "#e8c26a"); }

}

// Het weer volgt het echte marktweer: zon als bitcoin en de beurs boven hun 200-dagengemiddelde staan.
function sky() {
  const mw = (S && S.market_weather) || [];
  const bad = mw.filter(w => !w.ok).length;
  const dd = S ? S.total.drawdown : 0;
  if (dd > 0.05) return "storm";
  if (!mw.length) return "helder";
  return bad === 0 ? "zon" : bad === mw.length ? "regen" : "wolken";
}

function cloud(x, y, k) {
  blob(x, y, 12 * k, 4 * k, "rgba(235,235,245,.85)", 0); blob(x + 8 * k, y - 3 * k, 8 * k, 4 * k, "rgba(245,245,250,.9)", 1);
}

function weather() {
  const el = document.getElementById("weather"), kind = sky(), n = night();
  const vix = S && S.vix, scary = vix != null && vix >= 30;
  const dk = darkness(), {rise, set, h} = sunTimes();
  // zon en maan lopen in een boog over de hemel
  const dayP = Math.min(1, Math.max(0, (h - rise) / (set - rise)));
  const sx = 20 + dayP * 280, sy = 16 - Math.sin(dayP * Math.PI) * 8;      // langs de bovenrand, boven het water
  if (dk < .9 && kind !== "regen" && kind !== "storm") {
    const r = 8 + Math.sin(tick / 30), warm = dk > .1 || dayP < .12 || dayP > .88;
    ctx.globalAlpha = .9; blob(sx, sy, r, r, warm ? "#ff9a3c" : "#ffdf5a", 0); ctx.globalAlpha = .22;
    for (let a = 0; a < 8; a++) { const t = a / 8 * Math.PI * 2 + tick / 200; rect(sx + Math.cos(t) * 15, sy + Math.sin(t) * 15, 2, 2, "#ffdf5a"); }
    ctx.globalAlpha = 1;
  }
  if (dk > 0) {
    // schemer: eerst oranje-roze, dan diepblauw
    const dusk = Math.sin(Math.min(1, dk) * Math.PI);
    if (dusk > .05) { ctx.fillStyle = `rgba(255,120,60,${(.16 * dusk).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    ctx.fillStyle = `rgba(8,10,40,${(.34 * dk).toFixed(3)})`; ctx.fillRect(0, 0, W, H);
  }
  if (n) {
    for (let i = 0; i < 40; i++) {                        // sterren, alleen boven het water
      const x = (i * 71) % W, y = (i * 23) % 40;
      if ((x - 160) ** 2 / 136 ** 2 + (y - 104) ** 2 / 70 ** 2 < 1) continue;
      ctx.globalAlpha = .4 + .4 * Math.sin(tick / 20 + i); rect(x, y, 1, 1, "#fff8d8");
    }
    ctx.globalAlpha = 1;
    const nightP = h >= set ? (h - set) / (24 - set + rise) : (h + 24 - set) / (24 - set + rise);
    const mx = 20 + nightP * 280, my = 16 - Math.sin(nightP * Math.PI) * 8;
    blob(mx, my, 6, 6, "#f4ecd8", 0); blob(mx + 3, my - 2, 5, 5, "#0d2440", 0);
    lamps();
  }
  if (kind === "wolken" || kind === "regen" || kind === "storm") {
    for (let i = 0; i < (kind === "wolken" ? 3 : 6); i++) cloud((i * 70 + tick * .08) % (W + 40) - 20, 14 + (i % 3) * 8, kind === "wolken" ? 1 : 1.3);
  }
  if (kind === "regen" || kind === "storm") {
    ctx.fillStyle = kind === "storm" ? "rgba(20,20,40,.35)" : "rgba(30,40,70,.18)"; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = .6;
    const drops = kind === "storm" ? 120 : 60;
    for (let i = 0; i < drops; i++) { const x = (i * 29 + tick * 2) % W, y = (i * 17 + tick * 4) % H; rect(x, y, 1, 3, "#9fc4ff"); }
    ctx.globalAlpha = 1;
  }
  if ((kind === "storm" || scary) && tick % 240 < 4) { ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.fillRect(0, 0, W, H); }
  const mw = (S && S.market_weather) || [];
  const parts = mw.map(w => `${w.name}: ${w.ok ? "zon" : "regen"}`);
  if (vix != null) parts.push(`angstindex ${Math.round(vix)}${scary ? " (onweer!)" : ""}`);
  el.textContent = kind === "storm" ? `Storm: ${pct(S.total.drawdown)} onder de top. De Wachttoren bewaakt de grens.`
    : (parts.length ? "Marktweer · " + parts.join(" · ") : n ? "Nacht op het eiland." : "Helder weer op het eiland.");
  el.title = mw.map(w => w.text).join("\n");
}

// lantaarns langs het plein en het licht van de Wachttoren, alleen 's nachts
function lamps() {
  for (const [x, y] of [[146, 92], [174, 92], [146, 109], [174, 109], [120, 100], [200, 100]]) {
    ctx.globalAlpha = .18; blob(x, y + 2, 7, 4, "#ffd27a", 0); ctx.globalAlpha = 1;

// ------------------------------------------------------------------ muntjes bij trades
const coins = [];
function spawnCoins(id, buy, n = 8) {
  const b = B[id]; if (!b) return;
  const door = [b.x + b.w / 2, b.y - 4], hq = [160, 94];
  const [from, to] = buy ? [hq, door] : [door, hq];
  for (let i = 0; i < n; i++) coins.push({from, to, t: -i * 6, life: 70});
}
// Geldtransport: bij elke koop rijdt een waardetransport van het hoofdkwartier naar de afdeling,
// bij een verkoop terug. Over de echte straten: langs de park-straat, de avenue en de oprit.
const trucks = [];
function route(id) {
  const b = B[id], dx = Math.round(b.x + b.w / 2), av = AVENUES.find(a => a >= b.y + 2) || AVENUES[AVENUES.length - 1];
  const sx = dx < 160 ? 126 : 196;
  return [[sx, 100], [sx, av], [dx, av], [dx, b.y + 1]];
}
function sendTruck(id, buy, delay = 0) {
  if (!B[id] || trucks.length >= 6) return spawnCoins(id, buy);
  const r = route(id);
  trucks.push({id, buy, pts: buy ? r : [...r].reverse(), t: -delay});
}
function drawTrucks() {
  const n = night();
  for (let i = trucks.length - 1; i >= 0; i--) {
    const k = trucks[i]; k.t++;
    if (k.t < 0) continue;
    let dist = k.t * .35, j = 0;
    const len = (a, c) => Math.abs(c[0] - a[0]) + Math.abs(c[1] - a[1]);
    while (j < k.pts.length - 1 && dist > len(k.pts[j], k.pts[j + 1])) { dist -= len(k.pts[j], k.pts[j + 1]); j++; }
    if (j >= k.pts.length - 1) {          // aangekomen: muntjes uitladen
      const [ex, ey] = k.pts[k.pts.length - 1];
      for (let c = 0; c < 5; c++) coins.push({from: [ex, ey - 2], to: [ex + (c - 2) * 3, ey - 4], t: -c * 4, life: 28});
      trucks.splice(i, 1); continue;
    }
    const a = k.pts[j], c = k.pts[j + 1], L = len(a, c), p = L ? dist / L : 1;
    const horiz = a[1] === c[1], dir = horiz ? Math.sign(c[0] - a[0]) : Math.sign(c[1] - a[1]);
    const x = a[0] + (c[0] - a[0]) * p + (horiz ? 0 : dir), y = a[1] + (c[1] - a[1]) * p + (horiz ? dir : 0);
    const body = "#3d5a45", cab = "#5f8a6a", gold = "#ffcc4d";
    if (horiz) {
      rect(x - 4, y - 2, 8, 3, body); rect(x - 4, y - 1, 8, 1, gold);
      rect(dir > 0 ? x + 2 : x - 4, y - 2, 2, 3, cab); rect(dir > 0 ? x + 3 : x - 4, y - 2, 1, 1, "#9ad0ff");
      rect(x - 3, y + 1, 1, 1, "#111"); rect(x + 2, y + 1, 1, 1, "#111");
      if (n) rect(dir > 0 ? x + 4 : x - 5, y - 1, 1, 1, "#fff8c0");
    } else {
      rect(x - 1, y - 4, 3, 8, body); rect(x, y - 4, 1, 8, gold);
      rect(x - 1, dir > 0 ? y + 2 : y - 4, 3, 2, cab);
      if (n) rect(x, dir > 0 ? y + 4 : y - 5, 1, 1, "#fff8c0");
    }
    if (tick % 16 < 8) rect(x, y - (horiz ? 3 : 5), 1, 1, "#ffa040");          // zwaailicht
  }
}
function drawCoins() {
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i]; c.t++;
    if (c.t < 0) continue;
    if (c.t > c.life) { coins.splice(i, 1); continue; }
    const p = c.t / c.life, x = c.from[0] + (c.to[0] - c.from[0]) * p, y = c.from[1] + (c.to[1] - c.from[1]) * p - Math.sin(p * Math.PI) * 18;
    const w = Math.abs(Math.cos(c.t / 4)) * 3 + 1;
    rect(x - w / 2, y - 2, w, 4, "#ffcc4d"); rect(x - w / 2, y - 2, Math.max(1, w / 3), 1, "#fff2b0");
  }
}

// ------------------------------------------------------------------ tekstballonnen
function catchphrase(d) {
  const last = S.feed.find(f => f.desk === d.id && (f.kind === "trade" || f.kind === "refused" || f.kind === "reflection"));
  const why = last ? (last.why || last.detail || "") : "";
  let m;
  if (/noodrem/.test(why)) return "Noodrem! Het marktweer is slecht, wij staan droog.";
  if ((m = why.match(/RSI \((\d+)\)/)) && last.text.includes("koopt")) return `RSI ${m[1]}, ik koop de dip!`;
  if (/terugkeer klaar/.test(why)) return "Herstel binnen, winst pakken!";
  if (/trend omhoog/.test(why)) return "De trend is omhoog, wij gaan mee!";
  if (/trend omlaag/.test(why)) return "Trend omlaag. Wij stappen eruit.";
  if (/uitbraak:/.test(why)) return "Uitbraak! Nieuwe top in zicht.";
  if (/momentum:/.test(why)) return "Momentum! Stijgers blijven stijgen.";
  if (/herverdeling/.test(why)) return "Even herverdelen, alles weer in balans.";
  if (last && last.kind === "reflection") return "Terugblik gedaan. Weer wat geleerd!";
  if (last && last.kind === "refused") return "De Wachttoren zei nee. Veiligheid eerst.";
  if (d.mode === "vasthouden") return d.positions.length ? "Wij houden vast. Geduld wint." : "Klaar om in te stappen.";
  if (d.weather && /slecht/.test(d.weather)) return "We wachten op beter weer.";
  if (d.status === "gesloten") return "Zzz... de markt is dicht.";
  return d.positions.length ? "Alles onder controle." : "Wij wachten op een kans.";
}
let bubbleAt = 0, bubbleIdx = 0;
function bubbles() {
  const box = document.getElementById("bubbles");
  if (!S || Date.now() - bubbleAt < 6000) return;
  bubbleAt = Date.now();
  const d = S.desks[bubbleIdx++ % S.desks.length], b = geo(d.id);
  const x = offX + (b.x + b.w / 2) * scale, y = offY + (b.y - b.h - 7) * scale - 34;
  box.innerHTML = `<div class="bubble" style="left:${x}px;top:${y}px">${esc(catchphrase(d))}</div>`;
}

function frame() {
  tick++;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();      // niets buiten de wereld tekenen (geen sporen)
  drawWater(); drawIsland(); traffic();
  for (const sd of shadows()) plot(sd.id, sd);
  const order = ["meme", "crypto", "stocks", "risk", "lab", "metals", "fx"].sort((a, b) => B[a].y - B[b].y);
  for (const id of order) building(id, desk(id));
  workers(); drawTrucks(); drawCoins(); skyTraffic(); weather();
  ctx.restore();
  if (tick % 15 === 0) { placeSigns(); bubbles(); }
  requestAnimationFrame(frame);
}

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width; cv.height = r.height;
  scale = Math.max(1, Math.min(r.width / W, r.height / H));
  offX = (r.width - W * scale) / 2; offY = (r.height - H * scale) / 2;
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
  ctx.imageSmoothingEnabled = false;
  placeSigns();
}

const SIGN_AT = {crypto: [-4, 18], meme: [0, 9], stocks: [-30, -6], fx: [0, 10], lab: [-14, 6], risk: [-8, 14], metals: [0, -33]};
function placeSigns() {
  const box = document.getElementById("labels");
  if (!S) return;
  const html = [];
  for (const id of [...DESKS, "risk", "lab"]) {
    const b = geo(id), d = desk(id);

    const x = offX + (b.x + b.w / 2 + dx) * scale, y = offY + Math.max(17, b.y - b.h - 7 - dy) * scale;   // bord altijd in beeld

    if (d) inner = `<b>${esc(b.label)}</b><span class="lv">Lv ${d.level}</span> · <span class="${cls(d.pnl_pct)}">${pct(d.pnl_pct)}</span>`;

      inner = `<b>Wachttoren</b>${S.kill ? '<span class="dn">noodstop aan</span>' : S.desks.some(x => x.status === "alarm") ? '<span class="dn">alarm</span>' : '<span class="up">alles veilig</span>'}`
        + (e !== null && e < 1 ? ` · <span class="dn" title="Risicodirecteur: zoveel crypto en memes in de markt">${Math.round(e * 100)}% in</span>` : "");
    }
    else {
      const n = labAlerts24h();

    }
    const alarm = d && d.status === "alarm";
    html.push(`<div class="sign ${selected === id ? "sel" : ""} ${alarm ? "alarm" : ""}" data-id="${id}" style="left:${x}px;top:${y}px">${inner}</div>`);
  }
  for (const sd of shadows()) {
    const b = P[sd.id];
    if (!b) continue;
    const x = offX + (b.x + b.w / 2) * scale, y = offY + (b.y - b.h - 13) * scale;
    const r = sd.since_start == null ? "" : ` · <span class="${cls(sd.since_start)}">${pct(sd.since_start)}</span>`;

  }
  box.innerHTML = html.join("");
  box.querySelectorAll(".sign").forEach(el => el.onclick = () => el.dataset.shadow ? openShadow() : select(el.dataset.id));
}

cv.addEventListener("click", ev => {

function spark(canvas, pts, base) {
  const c = canvas.getContext("2d"), w = canvas.width = canvas.clientWidth, h = canvas.height = 90;
  c.fillStyle = "#0b0816"; c.fillRect(0, 0, w, h);
  if (!pts || pts.length < 2) { c.fillStyle = "#b9ad93"; c.font = "11px monospace"; c.fillText("nog te weinig rondes voor een grafiek", 8, 48); return; }
  const v = pts.map(p => p[1]), lo = Math.min(...v, base), hi = Math.max(...v, base), pad = (hi - lo) * .1 || 1;
  const Y = x => h - 6 - (x - lo + pad) / (hi - lo + 2 * pad) * (h - 12);
  c.fillStyle = "#3a2f63"; for (let x = 0; x < w; x += 4) c.fillRect(x, Math.round(Y(base)), 2, 1);
  c.fillStyle = v[v.length - 1] >= base ? "#5fe08a" : "#ff5d6c";
  for (let i = 0; i < w; i += 2) { const k = Math.min(v.length - 1, Math.round(i / w * (v.length - 1))); c.fillRect(i, Math.round(Y(v[k])), 2, 2); }
}

function jarvisStatus() {
  const h = (S.jarvis && S.jarvis.health) || {status: "ok", issues: []};
  const issues = [...h.issues];
  const ageH = (Date.now() - new Date(S.generated_at)) / 3600e3;
  if (!S.demo && ageH > 2.5) issues.unshift({level: "alarm", text: `de laatste ronde is ${Math.round(ageH)} uur geleden: de bot draait niet`});
  const status = issues.some(i => i.level === "alarm") ? "alarm" : issues.length ? "let op" : "ok";
  return {status, issues};
}
function jarvisCard() {
  const b = S.jarvis && S.jarvis.briefing;

  const h = jarvisStatus();

  return `<div class="jarvis-card"><div class="head"><div class="arc ${c}"></div>
    <div><b class="px">JARVIS</b><div class="hint">${h.status === "ok" ? "alle systemen normaal" : esc(h.status)} · ${when(b.at)}</div></div></div>

    <button onclick="speak()">🔊 Voorlezen</button></div>`;
}
function speak() {
  const b = S.jarvis && S.jarvis.briefing;
  if (!b || !window.speechSynthesis) return toast("Voorlezen kan niet in deze browser");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(b.speech.replace(/€/g, "euro "));
  u.lang = "nl-NL"; u.rate = 1.02;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("nl"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
let WI = {series: "Hele holding", amount: 1000, start: 0};
const wiDate = s => new Date(s).toLocaleDateString("nl-NL", {day: "numeric", month: "short", year: "numeric"});
function whatifCard() {
  const W = S.whatif;
  if (!W || !W.series || !Object.keys(W.series).length) return "";
  if (!W.series[WI.series]) WI.series = Object.keys(W.series)[0];
  const n = W.series[WI.series].length;
  WI.start = Math.min(WI.start, n - 2);
  return `<h3 class="px">Wat als?</h3><div class="card whatif">
    <div class="row"><select id="wi-s" onchange="WI.series=this.value;WI.start=0;whatifUpdate(true)">${Object.keys(W.series).map(k => `<option ${k === WI.series ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>
      <span>€ <input type="number" min="10" step="100" value="${WI.amount}" style="width:90px" oninput="WI.amount=Math.max(1,+this.value||1000);whatifUpdate()"></span></div>
    <div class="hint" style="margin:6px 0 2px">Ingestapt op <b id="wi-d"></b></div>
    <input id="wi-r" type="range" min="0" max="${n - 2}" value="${WI.start}" oninput="WI.start=+this.value;whatifUpdate()">
    <div id="wi-res"></div>
    <canvas class="spark" id="wi"></canvas>

function whatifUpdate(reset) {
  const el = document.getElementById("wi");
  if (!el || !S.whatif || !S.whatif.series) return;
  const all = S.whatif.series[WI.series];
  if (reset) { const r = document.getElementById("wi-r"); r.max = all.length - 2; r.value = WI.start; }
  const pts = all.slice(WI.start), p0 = pts[0], p1 = pts[pts.length - 1];
  const mine = WI.amount * p1[1] / p0[1], hold = WI.amount * p1[2] / p0[2];
  let peak = 0, dd = 0;
  for (const p of pts) { peak = Math.max(peak, p[1]); dd = Math.max(dd, 1 - p[1] / peak); }
  document.getElementById("wi-d").textContent = `${wiDate(p0[0])} (tot ${wiDate(p1[0])})`;
  document.getElementById("wi-res").innerHTML = `
    <div class="row"><span>Met de huidige regels</span><b class="${cls(mine / WI.amount - 1)}">${eur(mine, 0)} (${pct(mine / WI.amount - 1)})</b></div>
    <div class="row"><span>Gewoon vasthouden</span><span class="${cls(hold / WI.amount - 1)}">${eur(hold, 0)} (${pct(hold / WI.amount - 1)})</span></div>
    <div class="row"><span>Grootste tussentijdse daling</span><span class="dn">${pct(-dd)}</span></div>`;
  const c = el.getContext("2d"), w = el.width = el.clientWidth, h = el.height = 90;
  c.fillStyle = "#0b0816"; c.fillRect(0, 0, w, h);
  const a = pts.map(p => p[1] / p0[1]), b = pts.map(p => p[2] / p0[2]);
  const lo = Math.min(...a, ...b, 1), hi = Math.max(...a, ...b, 1), pad = (hi - lo) * .1 || .01;
  const Y = x => h - 6 - (x - lo + pad) / (hi - lo + 2 * pad) * (h - 12);
  c.fillStyle = "#3a2f63"; for (let x = 0; x < w; x += 4) c.fillRect(x, Math.round(Y(1)), 2, 1);
  for (const [v, col] of [[b, "#8a95ad"], [a, "#d9a521"]]) {
    c.fillStyle = col;
    for (let i = 0; i < w; i += 2) { const k = Math.min(v.length - 1, Math.round(i / w * (v.length - 1))); c.fillRect(i, Math.round(Y(v[k])), 2, 2); }
  }
}

  return `<h3 class="px">Schaduw-arena</h3>
  <div class="hint">Andere strategieën draaien op papier mee met hetzelfde geld en dezelfde echte koersen, vanaf ${esc(a.start)} (${days} dagen). Alleen wat daarna gebeurt telt. Wint een uitdager ${a.promote_days} dagen lang op rendement én Sharpe, dan krijgt hij een 🏆 en meldt Jarvis het. Promoveren beslist alleen Phil. Sharpe verschijnt na 30 dagen; eerder zegt die niets.</div>
  ${Object.values(a.desks).map(d => `<div class="card"><div class="row"><b>${esc(d.name)}</b><span class="hint">huidige regels op plek ${d.live_rank} van ${d.board.length}</span></div>${arenaBoard(a, d)}</div>`).join("")}`;
}

function labAlerts24h() {
  if (!S || !S.lab) return 0;
  const since = new Date(S.generated_at).getTime() - 24 * 3600e3;
  return S.lab.alerts.filter(a => new Date(a.ts).getTime() >= since && a.level !== "info").length;
}

// Lessenboek: alles wat de holding leert, ook van weigeringen, instapmomenten en backtests.
const RULE_NL = {kostenwacht: "kostenwacht", ordergrootte: "ordergrootte", geen_bijkopen_bij_verlies: "niet bijkopen bij verlies",
  max_drawdown: "dalingsgrens", dagverlies: "dagverlies", trades_per_dag: "trades per dag", koers_vers: "verse koers", niet_gepauzeerd: "pauze", noodstop: "noodstop"};
function lessonSection() {
  const B = S.lessons || {items: [], summary: {rules: [], entry: null}, count: 0};
  const sm = B.summary || {rules: []};
  const topic = {weigering: "🛡️", instap: "🎯", backtest: "📊"};
  return `<h3 class="px">Lessenboek · wat we geleerd hebben</h3>
  ${sm.rules.length || sm.entry ? `<div class="card">
    ${sm.rules.slice(0, 5).map(r => `<div class="row"><span>${esc(RULE_NL[r.rule] || r.rule)} <span class="hint">${r.n}×</span></span>
      <span class="${r.avg_move < 0 ? "up" : "dn"}">${r.avg_move < 0 ? "bespaart" : "kost"} gem. ${pct(Math.abs(r.avg_move)).replace("+", "")}</span></div>`).join("")}
    ${sm.entry ? `<div class="row"><span>Instapmoment <span class="hint">${sm.entry.n}×</span></span><span class="${sm.entry.avg_gap > 0 ? "dn" : "up"}">gem. ${pct(Math.abs(sm.entry.avg_gap)).replace("+", "")} ${sm.entry.avg_gap > 0 ? "te duur" : "goedkoop"}</span></div>` : ""}
    <div class="hint" style="margin-top:4px">Per regel van de Wachttoren: wat deed de koers een week na een weigering? Daalde hij, dan bespaarde de regel geld.</div></div>` : ""}
  ${B.items.length ? B.items.slice(0, 8).map(x => `<div class="card hint">${topic[x.topic] || "•"} ${when(x.ts)} · ${esc(x.text)}</div>`).join("")
    : '<div class="hint">Het boek is nog leeg. Een week na de eerste weigering, twee weken na de eerste aankoop en bij de eerste wekelijkse backtest komen hier de eerste lessen.</div>'}`;
}

function labPanel() {
  const L = S.lab || {alerts: [], watch: [], reflections: [], records: [], reports: [], adjustments: {}};
  const who = {crypto: "Crypto Lab", meme: "Meme Arcade", stocks: "Beurstoren", metals: "De Kluis", fx: "Wisselhaven"};
  const rows = S.desks.flatMap(d => d.instruments.map(i => ({desk: d.name, ...i})));
  const counts = {};
  rows.forEach(r => { const f = (r.strategy || "").split("(")[0]; counts[f] = (counts[f] || 0) + 1; });
  const adj = L.adjustments || {};
  return `<h2 class="px">Onderzoekslab</h2><div class="mute">Kijkt terug, leert en houdt de wereld in de gaten</div>
  <div class="card">
    <div class="row"><span>Trades teruggeblikt</span><span>${L.reviewed}</span></div>
    <div class="row"><span>Met winst</span><span>${L.hit_rate == null ? "–" : Math.round(L.hit_rate * 100) + "%"}</span></div>
    <div class="row"><span>Gemiddeld t.o.v. vasthouden</span><span class="${cls(L.avg_edge)}">${L.avg_edge == null ? "–" : pct(L.avg_edge)}</span></div>
    <div class="hint" style="margin-top:4px">Een week na elke verkoop kijkt het lab of de trade slim was: wat had vasthouden gedaan, was de verkoop te vroeg, en welke strategie had het beter gedaan.</div></div>

  ${lessonSection()}

  <h3 class="px">Verkenners</h3>
  ${L.alerts.length ? L.alerts.slice(0, 8).map(a => `<div class="card hint"><span class="lvl-${a.level}">●</span> ${when(a.ts)} · ${esc(a.text)}</div>`).join("")
    : '<div class="hint">Geen ongewone bewegingen gezien. De verkenners kijken elk uur naar alle markten.</div>'}

  ${L.watch.length ? `<h3 class="px">De wereld</h3><table><tr><th>Markt</th><th class="r">24u</th></tr>
    ${L.watch.map(w => `<tr><td>${esc(w.name)} <span class="pill">${esc(w.kind)}</span></td><td class="r ${cls(w.change_24h)}">${pct(w.change_24h)}${w.fresh ? "" : ' <span class="hint">dicht</span>'}</td></tr>`).join("")}</table>
    <p class="hint">Alleen om mee te kijken. Hier wordt niet op gehandeld.</p>` : ""}

  <h3 class="px">Terugblik op trades</h3>
  ${L.reflections.length ? L.reflections.slice(0, 8).map(r => `<div class="card"><div class="row"><span><b>${esc(r.instrument)}</b> <span class="pill">${esc(who[r.desk] || r.desk)}</span></span>
      <span class="${cls(r.pnl_pct)}">${esc(r.verdict)} ${pct(r.pnl_pct)}</span></div>
      <div class="hint">${esc(strat(r.strategy))} · ${r.days} dagen · vasthouden ${pct(r.hold_pct)}</div>
      ${r.lessons.map(l => `<div class="lesson">→ ${esc(strat(l))}</div>`).join("")}</div>`).join("")
    : '<div class="hint">Nog geen afgeronde trades. Een week na de eerste verkoop verschijnt hier de eerste terugblik.</div>'}

  <h3 class="px">Rapportcijfers strategieën</h3>
  ${L.records.length ? `<table><tr><th>Strategie</th><th class="r">Trades</th><th class="r">Raak</th><th class="r">vs houden</th></tr>
    ${L.records.map(r => { const a = adj[r.desk + ":" + r.strategy];
      return `<tr><td class="hint">${esc(strat(r.strategy))}${a ? ` <span class="${a < 0 ? "dn" : "up"}">${a < 0 ? "straf" : "bonus"}</span>` : ""}</td><td class="r">${r.trades}</td><td class="r">${Math.round(r.hit_rate * 100)}%</td><td class="r ${cls(r.avg_edge)}">${pct(r.avg_edge)}</td></tr>`; }).join("")}</table>
    <p class="hint">Na 3 of meer trades krijgt een strategie die live slechter is dan vasthouden strafpunten bij de weekkeuze. Duidelijk beter? Dan een kleine bonus.</p>`
    : '<div class="hint">Nog geen cijfers. Die komen na de eerste terugblikken.</div>'}

  <h3 class="px">Weekrapporten</h3>
  ${L.reports.length ? L.reports.map(r => `<div class="card hint"><b>${esc(who[r.desk] || r.desk)}</b> · ${when(r.ts)}<br>${esc(strat(r.reason.replace(/^weekrapport: /, "")))}</div>`).join("")
    : '<div class="hint">Het eerste weekrapport komt na 7 dagen.</div>'}

  ${arenaSection()}
  ${shadowSection()}

  <h3 class="px">Strategietoernooi</h3>
  <div class="hint">Elke week strijden alle strategieën per instrument op de laatste 500 dagen, na kosten. Vasthouden wint, tenzij een strategie duidelijk beter is.</div>
  <table>${Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k.replaceAll("_", "-"))}</td><td class="r">${v}×</td></tr>`).join("")}</table>`;
}

function autopilot() {
  const ageMin = (Date.now() - new Date(S.generated_at)) / 60e3;
  const next = new Date(new Date(S.generated_at).getTime() + 60 * 60e3).toLocaleTimeString("nl-NL", {hour: "2-digit", minute: "2-digit"});
  if (S.demo) return {label: "DEMO", cls: "warn", next, ageMin, text: "Dit is de nep-wereld: hier draait geen autopiloot."};
  if (ageMin <= 80) return {label: "AAN", cls: "", next, ageMin, text: "Alles draait vanzelf."};
  if (ageMin <= 150) return {label: "TRAAG", cls: "warn", next, ageMin, text: "De laatste ronde is wat lang geleden; Jarvis start hem zelf opnieuw."};
  return {label: "STIL", cls: "alarm", next, ageMin, text: "Er is al lang geen ronde geweest. Jarvis meldt dit via Telegram."};
}

function directorCard() {
  const R = S.risk;
  if (!R || typeof R.exposure !== "number") return "";
  const e = R.exposure, b = R.backtest;
  const pc = v => v == null ? "?" : Math.round(v * 100) + "%";
  const corr = typeof R.crypto_meme_corr === "number" ? R.crypto_meme_corr : null;
  const calm = !R.vol || R.vol <= R.target;
  return `<h3 class="px">Risicodirecteur</h3><div class="card">
    <div class="row"><span>Crypto + memes in de markt</span><span class="${e >= 1 ? "up" : ""}"><b>${pc(e)}</b></span></div>
    <div class="bar" style="margin:6px 0"><i style="width:${Math.round(e * 100)}%;background-color:${e >= .9 ? "var(--good)" : e >= .6 ? "var(--warn)" : "var(--bad)"}"></i></div>
    <div class="row"><span>Beweeglijkheid (${R.vol_days} dagen)</span><span class="${calm ? "up" : "dn"}">${R.vol ? pc(R.vol) : "?"} per jaar</span></div>
    <div class="row"><span>Doel</span><span>${pc(R.target)} per jaar</span></div>
    ${corr !== null ? `<div class="row"><span>Crypto en memes bewegen samen</span><span>${Math.round(corr * 100)}%</span></div>` : ""}
    ${b ? `<table style="margin-top:6px"><tr><td></td><td class="r">rendement</td><td class="r">Sharpe</td><td class="r">diepste daling</td></tr>
      <tr><td>zonder directeur</td><td class="r">${pct(b.base.return)}</td><td class="r">${b.base.sharpe.toFixed(2)}</td><td class="r">${pct(-b.base.max_dd)}</td></tr>
      <tr><td>met directeur ${b.wins ? "✅" : ""}</td><td class="r">${pct(b.director.return)}</td><td class="r">${b.director.sharpe.toFixed(2)}</td><td class="r">${pct(-b.director.max_dd)}</td></tr></table>` : ""}
    <div class="hint" style="margin-top:4px">${e >= 1 ? (calm ? "Rustig genoeg: alles zit in de markt." : "Net iets boven het doel, te weinig om kosten voor te maken: alles blijft in de markt.") : `Te wild: ${pc(1 - e)} staat als geld klaar tot het weer rustiger wordt.`}
      Hoe wilder crypto en memes bewegen, hoe minder erin zit. Aandelen, metalen en valuta blijven zoals ze zijn.
      ${b ? `Getest op echte koersen sinds ${wiDate(b.since)}${b.wins ? ": hij won, dus hij mag sturen." : ": hij won niet, dus hij stuurt nu niet bij."}` : ""}</div></div>`;
}

function riskPanel() {
  return `<h2 class="px">Wachttoren</h2><div class="mute">De risico-afdeling mag elke order weigeren</div>
  <div class="card"><div class="row"><span>Noodstop</span><span class="${S.kill ? "dn" : "up"}">${S.kill ? "AAN" : "uit"}</span></div>
  <div class="row"><span>Max daling vanaf de top</span><span>${pct(S.limits.max_drawdown_pct, 0)}</span></div>
  <div class="row"><span>Max verlies per dag</span><span>${pct(S.limits.daily_loss_limit_pct, 0)}</span></div></div>
  ${directorCard()}
  <h3 class="px">Autopiloot</h3>
  ${(() => { const a = autopilot(); return `<div class="card"><div class="row"><span>Status</span><span class="${a.cls === "alarm" ? "dn" : a.cls ? "" : "up"}">${a.label}</span></div>
    <div class="row"><span>Laatste ronde</span><span>${when(S.generated_at)} (${Math.round(a.ageMin)} min geleden)</span></div>
    <div class="row"><span>Volgende ronde</span><span>rond ${a.next}</span></div>
    <div class="row"><span>Jarvis kijkt</span><span>elke 10 minuten</span></div>
    <div class="hint" style="margin-top:4px">${esc(a.text)} Een hartslag in GitHub maakt Jarvis elke 10 minuten wakker. Jarvis beantwoordt Telegram, start de uurronde en zet de hartslag weer aan als die ooit wegvalt. Je hoeft er niets voor te doen.</div></div>`; })()}
  <h3 class="px">Status per team</h3>
  <table>${S.desks.map(d => `<tr><td>${esc(d.name)}</td><td class="r ${d.status === "alarm" ? "dn" : ""}">${esc(d.status)}</td><td class="r">${pct(-d.drawdown)}</td></tr>`).join("")}</table>
  <h3 class="px">Laatste weigeringen</h3>
  ${S.feed.filter(f => f.kind === "refused").slice(0, 8).map(f => `<div class="card hint">${when(f.ts)} · ${esc(f.text)}<br>${esc(f.detail)}</div>`).join("") || '<div class="hint">Nog niets geweigerd.</div>'}`;
}

function select(id) {
  selected = id;
  const side = document.getElementById("side");
  const d = desk(id);
  side.innerHTML = d ? deskPanel(d) : id === "lab" ? labPanel() : id === "risk" ? riskPanel() : hqPanel();
  const sp = document.getElementById("sp");
  if (sp) spark(sp, d ? d.equity_curve : S.total.equity_curve, d ? d.capital_eur : S.total.capital_eur);
  whatifUpdate();
  placeSigns();
}

function hud() {
  const t = S.total;
  document.getElementById("h-eq").textContent = eur(t.equity_eur);
  const pnl = document.getElementById("h-pnl"); pnl.textContent = `${pct(t.pnl_pct)} sinds start · vandaag ${pct(t.day_pnl_pct)}`; pnl.className = "hint " + cls(t.pnl_pct);
  const hp = Math.max(0, 1 - t.drawdown / S.limits.max_drawdown_pct);
  const hpEl = document.getElementById("h-hp");
  hpEl.style.width = hp * 100 + "%";
  hpEl.style.backgroundColor = hp > .6 ? "var(--good)" : hp > .3 ? "var(--warn)" : "var(--bad)";
  document.getElementById("h-hpt").textContent = `${pct(-t.drawdown)} van max ${pct(-S.limits.max_drawdown_pct, 0)}`;
  const en = Math.max(0, 1 - Math.max(0, -t.day_pnl_pct) / S.limits.daily_loss_limit_pct);
  document.getElementById("h-en").style.width = en * 100 + "%";
  document.getElementById("h-ent").textContent = `${Math.round(en * 100)}% van het dagbudget over`;
  document.getElementById("h-day").style.width = Math.min(1, S.days_active / 90) * 100 + "%";
  document.getElementById("h-dayt").textContent = `dag ${S.days_active} van minimaal 90`;
  const a = autopilot();
  document.getElementById("h-time").textContent = when(S.generated_at);
  const ab = document.getElementById("b-auto");
  ab.textContent = "AUTO: " + a.label;
  ab.className = "badge auto " + a.cls;
  document.getElementById("b-kill").hidden = !S.kill;
  document.getElementById("b-demo").hidden = !S.demo;
  const j = jarvisStatus(), jb = document.getElementById("b-jarvis");
  jb.textContent = "JARVIS: " + (j.status === "ok" ? "OK" : j.status.toUpperCase());
  jb.className = "badge jarvis " + (j.status === "alarm" ? "alarm" : j.status === "ok" ? "" : "warn");
}

const DESK_COLOR = {crypto: "#2bb3a3", meme: "#8b4fd8", stocks: "#8a95ad", metals: "#d9a521", fx: "#3f7fd6"};
function price(v, cur) {
  const d = v >= 1000 ? 0 : v >= 10 ? 2 : v >= 0.01 ? 4 : 8;
  const sym = {EUR: "€", USD: "$", GBP: "£", JPY: "¥", CHF: "CHF "}[cur] ?? "";
  return sym + Number(v).toLocaleString("nl-NL", {minimumFractionDigits: Math.min(d, 2), maximumFractionDigits: d});
}
function miniLine(pts, up) {
  if (!pts || pts.length < 2) return "";
  const lo = Math.min(...pts), hi = Math.max(...pts), k = hi - lo || 1;
  const d = pts.map((v, i) => `${(i / (pts.length - 1) * 40 + 1).toFixed(1)},${(13 - (v - lo) / k * 12).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 42 14"><polyline points="${d}" fill="none" stroke="${up ? "#5fe08a" : "#ff5d6c"}" stroke-width="1.4"/></svg>`;
}
let tapeKey = "";
function tape() {
  const T = S.ticker || [], run = document.getElementById("tape-run");
  const key = S.generated_at + T.length;
  if (!run || key === tapeKey) return;
  tapeKey = key;
  if (!T.length) { document.getElementById("tape").hidden = true; return; }
  const one = T.map(t => {
    const up = (t.change ?? 0) >= 0;
    return `<span class="tk ${t.fresh ? "" : "closed"}" onclick="select('${t.desk}')" title="${esc(t.symbol)}${t.fresh ? "" : " · markt dicht, laatste koers"}">
      <i class="dot" style="background:${DESK_COLOR[t.desk] || "#888"}"></i><b>${esc(t.name)}</b>
      <span class="p">${price(t.price, t.currency)}</span><span class="${up ? "up" : "dn"}">${up ? "▲" : "▼"} ${pct(t.change)}</span>${miniLine(t.line, up)}</span>`;
  }).join("");
  run.innerHTML = one + one;                  // twee keer, voor een naadloze lus
  run.style.setProperty("--dur", Math.max(40, T.length * 5) + "s");
}

function feed() {
  const who = {crypto: "Crypto Lab", meme: "Meme Arcade", stocks: "Beurstoren", metals: "De Kluis", fx: "Wisselhaven", scouts: "Verkenners"};
  const box = document.getElementById("feed");
  box.innerHTML = S.feed.length ? S.feed.map(f =>
    `<div class="msg ${f.kind}"><span class="t">[${when(f.ts)}]</span> <span class="who">${esc(who[f.desk] || f.desk)}:</span> <span class="txt">${esc(strat(f.text))}</span> <span class="t">${esc(strat(f.strategy || ""))}</span>${f.detail ? `<div class="det">${esc(strat(f.detail))}</div>` : ""}</div>`).join("")
    : '<div class="msg t">Nog geen gebeurtenissen. De eerste ronde draait binnen het uur.</div>';
  box.querySelectorAll(".msg").forEach(el => el.onclick = () => el.classList.toggle("open"));
  const bl = badgeList();
  document.getElementById("quests").innerHTML = `<div class="px" style="font-size:12px">Badges ${bl.filter(b => b.got).length}/${bl.length}</div>
    <div class="badges">${bl.map(b => `<div class="bdg ${b.got ? "got" : ""}" title="${esc(b.title)}">${b.icon}</div>`).join("")}</div>
    <div class="px" style="font-size:12px;margin-bottom:4px">Missies</div>` + S.missions.map(m => {
    const done = m.progress >= m.goal;
    return `<div class="quest ${done ? "done" : ""} ${m.locked ? "locked" : ""}"><div class="qt"><span>${done ? "✔ " : m.locked ? "🔒 " : ""}${esc(m.title)}</span><span>${m.progress}/${m.goal}</span></div>
      <div class="bar xp"><i style="width:${Math.min(1, m.progress / m.goal) * 100}%"></i></div>${m.hint ? `<div class="hint">${esc(m.hint)}</div>` : ""}</div>`;
  }).join("");
}

// ------------------------------------------------------------------ feestjes: muntjes, missies en badges
function toast(text) {
  const el = document.getElementById("toast");
  el.innerHTML = text; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 4500);
}
function celebrate(prev) {
  const seenTs = localStorage.getItem("jplh-seen-ts") || (prev ? prev.generated_at : new Date(Date.now() - 2 * 3600e3).toISOString());
  const fresh = S.feed.filter(f => f.kind === "trade" && f.ts > seenTs);
  fresh.slice(0, 6).forEach((f, i) => sendTruck(f.desk, f.text.includes("koopt"), i * 90));
  localStorage.setItem("jplh-seen-ts", S.generated_at);
  const got = JSON.parse(localStorage.getItem("jplh-badges") || "[]");
  for (const bd of badgeList()) {
    if (bd.got && !got.includes(bd.id)) {
      got.push(bd.id);
      if (!S.demo) toast(`${bd.icon} Badge verdiend: ${esc(bd.title)}`);
    }
  }
  localStorage.setItem("jplh-badges", JSON.stringify(got));
}
function badgeList() {
  const m = id => S.missions.find(x => x.id === id) || {progress: 0, goal: 1};
  const done = id => m(id).progress >= m(id).goal;
  const L = S.lab || {reviewed: 0, alerts: []};
  return [
    {id: "first", icon: "🪙", title: "Eerste paper trade", got: done("first")},
    {id: "fifty", icon: "💰", title: "50 paper trades", got: done("fifty")},
    {id: "lesson", icon: "🔬", title: "Eerste terugblik in het lab", got: L.reviewed > 0},
    {id: "scout", icon: "🔭", title: "Eerste melding van de verkenners", got: L.alerts.length > 0},
    {id: "week", icon: "📅", title: "Een week actief", got: S.days_active >= 7},
    {id: "level5", icon: "⭐", title: "Een team op level 5", got: S.desks.some(d => d.level >= 5)},
    {id: "green", icon: "📈", title: "Holding in de plus", got: S.total.pnl_pct > 0},
    {id: "beat", icon: "🏆", title: "Beter dan koop-en-houd na 30 dagen", got: done("beat")},
    {id: "discipline", icon: "🛡️", title: "30 dagen binnen de risicogrenzen", got: done("discipline")},
    {id: "demo", icon: "🎓", title: "Demofase afgerond", got: done("demo")},
  ];
}

async function load() {
  try {
    const r = await fetch("state.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const prev = S;
    S = await r.json();
    document.getElementById("err").style.display = "none";
    hud(); tape(); feed(); select(selected);
    celebrate(prev);
  } catch (e) {
    const el = document.getElementById("err");
    el.style.display = "block";
    el.innerHTML = `<b>Kan de stand niet laden.</b><br><span class="hint">${esc(e.message)}. Open het dashboard via de link van GitHub Pages of met <code>jplh dashboard</code>.</span>`;
  }
}

window.addEventListener("resize", resize);
resize(); load(); frame();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
