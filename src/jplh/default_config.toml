# ---------------------------------------------------------------- schaduw-afdelingen (alleen papier)
# Nieuwe afdelingen beginnen als schaduw: ze draaien alleen mee in de arena (Onderzoekslab),
# met echte koersen, vanaf de eerste paper-dag. Er wordt NOOIT op gehandeld. Maakt een
# schaduw-afdeling de holding aantoonbaar sterker, dan beslist Phil of hij er echt bij komt.
# Alleen in euro's genoteerde ETF's, zodat er geen valuta-effect in zit.

[[shadow]]
symbol = "XEON.DE"
name = "Geldmarkt (Xtrackers EUR Overnight)"
desk = "schatkist"

[[shadow]]
