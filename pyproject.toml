[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jplh"
version = "0.1.0"
description = "JP-libau Holding: all-in-one trading- en onderzoeksbot (paper trading eerst)"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jplh = "jplh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jplh = ["default_config.toml", "hq/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
